<!DOCTYPE html>
<html>
<head>

<title>Lotes – SISTEMA NFV</title>

<style>

body{
    font-family: Arial;
    margin: 10px;
    background: #f4f6f8;
}

.card{
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.boton{
    display: block;
    text-align: center;
    padding: 12px;
    margin-top: 8px;
    border-radius: 8px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.historial{
    background: #3498db;
}

.tarea{
    background: #27ae60;
}

.crear{
    background: #2c3e50;
    margin-bottom: 20px;
}

</style>
</head>

<body>

<h2>Lotes de la campaña</h2>

<a class="boton crear" href="/crear_lote/{{ campania_id }}">
➕ Crear lote
</a>

{% for l in lotes %}
<div class="card">

<strong>{{ l.nombre }}</strong><br>
{{ l.superficie }} ha<br>
{{ l.cultivo }}

<a class="boton historial" href="/historial/{{ l.id }}">
📜 Ver historial
</a>

<a class="boton tarea" href="/cargar_tarea/{{ l.id }}">
➕ Cargar tarea
</a>

</div>
{% endfor %}

</body>
</html>
