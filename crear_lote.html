<!DOCTYPE html>
<html>
<head>
    <title>Crear Lote – SISTEMA NFV</title>
</head>
<body>

<h2>Crear lote</h2>

<form method="POST">

    <label>Nombre del lote</label><br>
    <input type="text" name="nombre" required><br><br>

    <label>Superficie (ha)</label><br>
    <input type="number" step="0.01" name="superficie"><br><br>

    <label>Cultivo</label><br>
    <input type="text" name="cultivo"><br><br>

    <button type="submit">Crear lote</button>

</form>

</body>
</html>
