<!DOCTYPE html>
<html>
<head>

<title>Historial – SISTEMA NFV</title>

<style>

body{
    font-family: Arial;
    margin: 10px;
    background: #f4f6f8;
}

.card{
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.boton{
    display:block;
    text-align:center;
    padding:14px;
    background:#27ae60;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    margin-bottom:20px;
}

</style>
</head>

<body>

<h2>Historial del lote</h2>

<a class="boton" href="/cargar_tarea/{{ lote_id }}">
➕ Cargar nueva tarea
</a>

{% for t in tareas %}
<div class="card">

<strong>Fecha:</strong> {{ t.fecha }}<br>
<strong>Labor:</strong> {{ t.tipo_labor }}<br>
<strong>Detalle:</strong> {{ t.detalle }}<br>
<strong>Dosis:</strong> {{ t.dosis }}<br>
<strong>Maquinaria:</strong> {{ t.maquinaria }}<br>
<strong>Operario:</strong> {{ t.operario }}<br>
<strong>Obs:</strong> {{ t.observaciones }}

</div>
{% endfor %}

</body>
</html>
