<!DOCTYPE html>
<html>
<head>

<title>Campañas – SISTEMA NFV</title>

<style>

body{
    font-family: Arial;
    margin: 10px;
    background: #f4f6f8;
}

.card{
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.boton{
    display:block;
    text-align:center;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    background:#3498db;
}

.crear{
    background:#2c3e50;
    margin-bottom:20px;
}

</style>
</head>

<body>

<h2>Campañas registradas</h2>

<a class="boton crear" href="/crear_campania">
➕ Crear nueva campaña
</a>

{% for c in campanias %}
<div class="card">

<strong>{{ c.nombre }}</strong><br>
Inicio: {{ c.fecha_inicio }}<br>
Fin: {{ c.fecha_fin }}

<a class="boton" href="/lotes/{{ c.id }}">
🌱 Ver lotes
</a>

</div>
{% endfor %}

</body>
</html>
