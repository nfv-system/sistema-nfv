<!DOCTYPE html>
<html>
<head>

<title>Cargar tarea – SISTEMA NFV</title>

<style>

body{
    font-family: Arial;
    margin: 10px;
    background: #f4f6f8;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<h2>Cargar tarea</h2>

<form method="POST">

<label>Fecha</label>
<input type="date" name="fecha" required>

<label>Tipo de labor</label>
<input type="text" name="tipo_labor">

<label>Detalle</label>
<input type="text" name="detalle">

<label>Dosis</label>
<input type="text" name="dosis">

<label>Maquinaria</label>
<input type="text" name="maquinaria">

<label>Operario</label>
<input type="text" name="operario">

<label>Observaciones</label>
<textarea name="observaciones"></textarea>

<button type="submit">
Guardar tarea
</button>

</form>

</body>
</html>
